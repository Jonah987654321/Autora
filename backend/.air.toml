work_dir = "."
delay = 1000
tmp_dir = ".tmp"

[build]
# Build and run arguments
cmd = "go build -o ./.tmp/main ./main.go"
entrypoint = ["./.tmp/main"]

# Watching setup
include_dir = ["."]
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = [".tmp"]

log = "air_errors.log"
poll = true
poll_interval = 500

stop_on_error = true
send_interrupt = false
kill_delay = 500

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
